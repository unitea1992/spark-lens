# Trigger the free CodeRabbit review on public PRs with fewer than 10 stars.
# CodeRabbit requires a manual trigger for these repositories, so this workflow
# posts the same comment a person would post.
name: Request CodeRabbit review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: >-
      ${{
        !github.event.repository.private &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !contains(github.event.pull_request.body, '@coderabbitai ignore')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request review
        # Pinned to v9.0.0; this repository requires full-length commit SHAs.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (repo.stargazers_count >= 10) {
              core.info('CodeRabbit automatic review is available at 10+ stars.');
              return;
            }

            const headSha = context.payload.pull_request.head.sha;
            const marker = `<!-- coderabbit-review-request:${headSha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`CodeRabbit review already requested for ${headSha}.`);
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `@coderabbitai review\n${marker}`,
            });
